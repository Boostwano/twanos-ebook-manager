name: Bug report
description: Report a reproducible Twano problem without including private data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never include API keys, private book-library details, or unredacted logs.
        Use copied or expendable ebooks when reproducing file-operation issues.
  - type: input
    id: version
    attributes:
      label: Twano version
      placeholder: R4 RC1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: files
    attributes:
      label: Were ebook files changed unexpectedly?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
